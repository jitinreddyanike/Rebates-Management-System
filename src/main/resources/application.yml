spring:
  application:
    name: rebates-management
  datasource:
    url: jdbc:h2:mem:rebatedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.rebates: DEBUG
